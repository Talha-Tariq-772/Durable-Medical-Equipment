<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F2EA" />
    <!-- Set the theme before anything paints, so there is no flash of the wrong theme. -->
    <script>
      (function () {
        var stored = null
        try {
          stored = localStorage.getItem('daud-dme-theme')
        } catch (e) {}
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#161514' : '#F6F2EA')
      })()
    </script>
    <title>Daud DME | Durable Medical Equipment in Salt Lake City, Utah</title>
    <meta
      name="description"
      content="Daud DME supplies quality durable medical equipment and supplies to patients, hospitals, clinics and healthcare providers from Salt Lake City, Utah."
    />
    <meta property="og:title" content="Daud DME | Durable Medical Equipment" />
    <meta
      property="og:description"
      content="High-quality medical equipment that supports patient care, recovery, mobility and daily living."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/home-family.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
